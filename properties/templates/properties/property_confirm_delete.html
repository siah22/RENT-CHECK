{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Delete Property" %}{% endblock %}
{% block content %}
<h2>{% blocktrans %}Delete "{{ property.title }}"?{% endblocktrans %}</h2>
<p class="text-danger">{% trans "This action cannot be undone." %}</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">{% trans "Yes, delete" %}</button>
    <a href="{% url 'properties:my_properties' %}" class="btn btn-link">{% trans "Cancel" %}</a>
</form>
{% endblock %}
