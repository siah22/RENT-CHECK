{% extends "base.html" %}
{% block title %}Report Listing — {{ property.title }}{% endblock %}
{% block content %}
<h2>Report "{{ property.title }}"</h2>
<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label">Reason</label>
        {{ form.reason }}
    </div>
    <div class="mb-3">
        <label class="form-label">Additional details</label>
        {{ form.description }}
    </div>
    <button type="submit" class="btn btn-danger">Submit Report</button>
    <a href="{% url 'properties:detail' property.pk %}" class="btn btn-link">Cancel</a>
</form>
{% endblock %}
