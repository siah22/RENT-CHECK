{% extends "base.html" %}
{% block title %}Contact Owner — {{ property.title }}{% endblock %}
{% block content %}
<h2>Contact owner/agent about "{{ property.title }}"</h2>
<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        {{ form.message }}
    </div>
    <button type="submit" class="btn btn-success">Send Inquiry</button>
    <a href="{% url 'properties:detail' property.pk %}" class="btn btn-link">Cancel</a>
</form>
{% endblock %}
