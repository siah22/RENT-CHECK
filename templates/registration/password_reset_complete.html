{% extends "base.html" %}
{% block title %}Password Changed — RentCheck Tanzania{% endblock %}
{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4 text-center">
                <div class="avatar-circle mx-auto mb-3" style="width: 60px; height: 60px; font-size: 1.5rem;">
                    <i class="bi bi-check2-circle"></i>
                </div>
                <h3 class="fw-bold mb-2">Password Changed</h3>
                <p class="text-muted small mb-0">
                    Your password has been reset successfully. You can now sign in with your new password.
                </p>
                <a href="{% url 'accounts:login' %}" class="btn btn-success btn-sm fw-semibold mt-4">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
