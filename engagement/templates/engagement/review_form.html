{% extends "base.html" %}
{% block title %}Review — {{ property.title }}{% endblock %}
{% block content %}
<h2>Review "{{ property.title }}"</h2>
<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label">Rating</label>
        {{ form.rating }}
    </div>
    <div class="mb-3">
        <label class="form-label">Comment</label>
        {{ form.comment }}
    </div>
    <button type="submit" class="btn btn-success">Submit Review</button>
    <a href="{% url 'properties:detail' property.pk %}" class="btn btn-link">Cancel</a>
</form>
{% endblock %}
